---
# Direct managed resource examples (no Composition required).
#
# A Crossplane Composition can only create a FIXED set of managed resources in
# PatchAndTransform mode, but the number of group/role bindings is dynamic
# (a map of groups to roles). This project is therefore consumed directly via
# ProjectIAMMember managed resources, one per group/role binding - the
# Crossplane equivalent of the Terraform `for_each` over the flattened map.
#
# Replace PROJECT_ID with your GCP project ID before applying:
#   kubectl apply -f examples/project-iam-members.yaml
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: my-free-devops-team-compute-admin
spec:
  forProvider:
    member: group:my-free-devops-team@googlegroups.com
    project: PROJECT_ID
    role: roles/compute.admin
  providerConfigRef:
    name: gcp-provider-config
---
